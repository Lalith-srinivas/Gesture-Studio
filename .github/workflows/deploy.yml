name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Do NOT cancel in-progress runs as we want to allow these production deployments to complete cleanly.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBTqAV7ICb_efIvv5hn632fvqPfbpvbfjo' }}
          VITE_FIREBASE_AUTH_DOMAIN: gesture-studio.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: gesture-studio
          VITE_FIREBASE_STORAGE_BUCKET: gesture-studio.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 285043818581
          VITE_FIREBASE_APP_ID: 1:285043818581:web:312670c321b92a9ca954dc
          VITE_FIREBASE_MEASUREMENT_ID: G-S1WYRLPLSR
          VITE_WS_BACKEND_URL: wss://gesture-studio.onrender.com/ws

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 5000

